<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بلاغات المنشآت الوطنية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Cairo & Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        tajawal: ['Tajawal', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        brand: {
                            blue: '#1e3a8a',
                            gold: '#d97706',
                            emerald: '#059669'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-tajawal bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-navy-900 text-white shadow-xl sticky top-0 z-50 border-b border-slate-700">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-amber-600 to-amber-500 p-2.5 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-building-shield text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-cairo text-xl font-bold tracking-wide">منصة بلاغات المنشآت</h1>
                    <p class="text-xs text-slate-400">النظام الوطني الموحد لرصد ومتابعة مخالفات المنشآت</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openModal()" class="bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2 shadow-lg shadow-amber-500/20 active:scale-95">
                    <i class="fa-solid fa-plus-circle text-lg"></i>
                    <span>تقديم بلاغ جديد</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 flex-grow">
        
        <!-- Dashboard Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-8">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 mb-1">إجمالي البلاغات المسجلة</p>
                    <h3 id="statTotal" class="text-3xl font-black text-slate-800">0</h3>
                </div>
                <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-file-invoice"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 mb-1">بلاغات قيد المعالجة</p>
                    <h3 id="statPending" class="text-3xl font-black text-amber-600">0</h3>
                </div>
                <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-spinner fa-spin-pulse"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 mb-1">بلاغات مكتملة ومغلقة</p>
                    <h3 id="statCompleted" class="text-3xl font-black text-emerald-600">0</h3>
                </div>
                <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 mb-1">حالة اتصال المنصة</p>
                    <h3 class="text-lg font-
